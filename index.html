<!DOCTYPE html>
<html>
<head>
    <title>Family Hub</title> <!-- Titolo dell'applicazione che appare nella scheda del browser -->
    <meta charset="utf-8" /> <!-- Imposto la codifica dei caratteri, garantendo che i caratteri speciali siano visualizzati correttamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="app.jpg" /> <!-- Icona della mia webapp -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity=
    "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
     <link rel="stylesheet" href="stileapp.css"> <!-- Definisco lo stile della pagina in un file CSS esterno (lo carico dopo Bootstrap per evitare di sovrascrivere) -->
</head>
<body>
    <div class="container text-center mt-3"> <!-- Contenitore principale centrato con margine superiore -->

        <!-- Form per accedere all'app scegliendo il proprio nome utente -->
        <div id="formAccesso" class="row justify-content-center">
            <div class="col-md-4 accesso-box">
                <h1 class="text-center">Family Hub</h1>
                <h5 class="text-center">Benvenuto nell'App!😊</h5>
                <form>
                    <input type="text" id="inputNomeUtente" class="form-control mb-2" placeholder="Inserisci il tuo nome utente" required> 
                    <input type="password" id="inputPassword" class="form-control mb-2" placeholder="Inserisci la tua password" required> 
                    <button type="submit" class="btn btn-primary w-100">Accedi</button>
                </form>
            </div>
        </div>                

        <!-- Pagina Home completa (voglio nasconderla inizialmente) -->
        <div id="paginaHome">
            <h1>Family Hub</h1> <!-- Titolo dell'app -->
            <div class="row"> 
                <!-- Nell'attributo span viene messo il nome inserito dall'utente nel form di login -->
                <h5>👋 Ciao, <span id="nomeUtente"></span>!</h5> <!-- Saluto personalizzato all'utente-->
            </div>

        <!-- Sezione Classifica e Icona Utente (disposti come colonne laterali) -->
        <div class="row">  
            <div class="col-3"> 
                <h2>🏆 Classifica</h2>
                <div>
                    <!-- Tabella per visualizzare la classifica degli utenti in base ai punti -->
                    <table class="table">
                        <thead>
                            <tr>
                                <th>#</th> <!-- Numero di posizione in classifica -->
                                <th>Utente</th>
                                <th>Punti</th>
                            </tr>
                        </thead>
                        <!-- Qui metterò i dati dinamici (popolati tramite JavaScript) -->
                        <tbody id="classifica">
                            <tr>
                                <!-- Metto attributo colspan per estendere scrita sulle 3 colonne -->
                                <td colspan="3">Caricamento...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Colonna centrale per i punti totali dell'utente -->
            <div class="col-6 d-flex align-items-center justify-content-center">
                <div class="text-center">
                    <h2>🌟Punti Totali</h2>
                    <h3 id="puntiTotali">...</h3>
                </div>
            </div>
            
            <div class="col-3"> 
                <h2>👤Icona Utente</h2> 
                <div id="boxLogout" style="margin-top: 10px; cursor: pointer;">
                    <h5> ⚙️Logout</h5>
                </div>

            </div>
    </div>

        <div class="row mt-5"></div> <!-- Lascio spazio extra... -->

        <!-- Sezione Premi e Obiettivi (disposti centralmente) -->
        <div class="row justify-content-center">  <!-- Metto gli elementi centrati sulla riga -->
            <div class="col-4"> 
                <h2>🎖 Premi</h2>
                <h5 class="text-warning-emphasis">Lista dei premi riscossi e da riscuotere</h5>

                <!-- Tabelle in cui distinguo i premi riscossi e da riscuotere -->
                <ul class="nav nav-tabs">
                    <!-- Inizio della navigazione con stile "tabs" di Bootstrap -->
                    <li class="nav-item">
                        <!-- attributo active indica che "daRiscuotere" sarà il tab selezionato all'inizio-->
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#daRiscuotere">Premi Da riscuotere</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#riscossi">Premi Riscossi</button>
                    </li>
                </ul>

                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="daRiscuotere">
                        <ul id="listaPremiDaRiscattare" class="list-group">
                            <!-- Premi da riscuotere verranno inseriti qui... -->
                        </ul>
                    </div>
                    <div class="tab-pane fade" id="riscossi">
                        <ul id="listaPremiRiscossi" class="list-group">
                            <!-- Premi riscossi verranno inseriti qui... -->
                        </ul>
                    </div>
                </div>

            </div>

            <div class="col-4"> 
                <h2>🎯 Obiettivi</h2> 
                <h5 class="text-danger-emphasis">Attività e Sfide</h5>

                <!-- Tabelle in cui distinguo gli obiettivi in base alla frequenza -->
                <ul class="nav nav-tabs">
                    <!-- Inizio della navigazione con stile "tabs" di Bootstrap -->
                    <li class="nav-item">
                        <!-- attributo active indica che "Settimanali" sarà il tab selezionato all'inizio-->
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#settimanale">Settimanali</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#mensile">Mensili</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#annuale">Annuali</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#occasionali">Occasionali</button>
                    </li>
                </ul>
            </div>
        </div>
        </div>
        <!-- Importo il file JavaScript di Bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>    
        <script src="codiceapp.js"></script> <!-- Collegamento al mio file JavaScript personalizzato -->
    </body>
</html>
