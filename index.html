<!DOCTYPE html>
<html>
<head>
    <title>Family Hub</title> 
    <meta charset="utf-8" /> <!-- Imposto la codifica dei caratteri, garantendo che i caratteri speciali siano visualizzati correttamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="app.jpg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity=
    "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
     <link rel="stylesheet" href="stileapp.css"> <!-- Definisco lo stile della pagina in un file CSS esterno (lo carico dopo Bootstrap per evitare di sovrascrivere) -->
</head>
<body>
    <div class="container text-center mt-3"> <!-- Contenitore principale centrato con margine superiore -->

        <!-- Form per accedere all'app inserendo nome utente e password-->
        <div id="formAccesso" class="row justify-content-center">
            <div class="col-md-4 accesso-box">
                <h1 class="text-center">Family Hub</h1>
                <h5 class="text-center">Benvenuto nell'App!😊</h5>
                <form>
                    <input type="text" id="inputNomeUtente" class="form-control mb-2" placeholder="Inserisci il tuo nome utente" required> 
                    <input type="password" id="inputPassword" class="form-control mb-2" placeholder="Inserisci la tua password" required> 
                    <button type="submit" class="btn btn-primary w-100"> 🔓 Accedi</button>
                </form>
            </div>
        </div>                

        <!-- Pagina Home completa (voglio nasconderla inizialmente) -->
        <div id="paginaHome">
            <h1>Family Hub</h1>

        <!-- Sezione Classifica e Icona Utente (disposti come colonne laterali) -->
        <div class="row">  
            <div class="col-3"> 
                <h2>🏆 Classifica</h2>
                <div>
                    <!-- Tabella per visualizzare la classifica degli utenti in base ai punti -->
                    <table class="table">

                        <!-- Qui metterò i dati dinamici (popolati tramite JavaScript) -->
                        <tbody id="classifica">
                            <tr>
                                <!-- Metto attributo colspan per estendere scrita sulle 3 colonne -->
                                <td colspan="3">Caricamento...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Colonna centrale per i punti totali dell'utente -->
            <div class="col-6 d-flex align-items-center justify-content-center">
                <div class="text-center">
                    <h2>🎉 Punti Totali</h2>
                    <h3 id="puntiTotali">...</h3>
                </div>
            </div>
            
            <!-- Colonna con avatar, saluto e logout -->
            <div class="col-3 text-center mt-3">
                <img src="avatar.png" id="avatar" class="rounded-circle mb-2">
                <!-- Nell'attributo span metto l'id nomeUtente per personalizzare il saluto -->
                <h5 class="mb-2">Ciao, <span id="nomeUtente"></span>!</h5>
                <button id="boxLogout" class="btn btn-primary btn-sm">⚙️ Logout</button>
            </div>


    </div>

        <div class="row mt-5"></div> <!-- Lascio spazio extra... -->

        <!-- Sezione Premi -->
        <div class="row justify-content-center"> <!-- Metto gli elementi centrati sulla riga -->
            <div class="col-4"> 
                <h2>🎖 Premi</h2>

                <!-- Tabelle in cui distinguo i premi riscossi e da riscuotere -->
                <ul class="nav nav-tabs">
                    <!-- Inizio della navigazione con stile "tabs" di Bootstrap -->
                    <li class="nav-item">
                        <!-- attributo active indica che "daRiscuotere" sarà il tab selezionato di default -->
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#daRiscuotere">🎁 Da Riscattare</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#riscossi">✅ Riscossi</button>
                    </li>
                </ul>

                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="daRiscuotere">                   
                        <!-- Pulsante per aggiungere un nuovo premio -->
                        <button id="btnAggiungiPremio" class="btn btn-success mb-3 d-block mx-auto">✚ Aggiungi Premio</button>

                        <ul id="listaPremiDaRiscattare" class="list-group">
                            <!-- Premi da riscuotere verranno inseriti qui... -->
                        </ul>
                    </div>
                    <div class="tab-pane fade" id="riscossi">
                        <ul id="listaPremiRiscossi" class="list-group">
                            <!-- Premi riscossi verranno inseriti qui... -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Sezione Obiettivi -->
            <div class="col-4"> 
                <h2>🎯 Obiettivi</h2> 

                <!-- Tabs in cui distinguo gli obiettivi in base al tipo (Attività/Sfide) -->
                <ul class="nav nav-tabs"> <!-- Inizio della navigazione con stile "tabs" di Bootstrap -->
                    <li class="nav-item"> 
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#attivita">🛠️ Attività</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#sfide">⚡ Sfide</button>
                    </li>
                </ul>

                <!-- Contenuto principale dei tabs -->
                <div class="tab-content">
                    <!-- Tab Attività -->
                    <div class="tab-pane fade show active" id="attivita">
                        <hr class="divider-line">
                        <!-- Seconda distinzione degli obiettivi in base alla Frequenza -->
                        <ul class="nav nav-tabs flex-nowrap">
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#attivitaSettimanali">📅 Settimanali</button>
                            </li>
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#attivitaMensili">🗓️ Mensili</button>
                            </li>
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#attivitaAnnuali">📆 Annuali</button>
                            </li>
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#attivitaOccasionali">🔀 Occasionali</button>
                            </li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="attivitaSettimanali">
                                <ul id="listaAttivitaSettimanali" class="list-group">
                                    <!-- Attività settimanali -->
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="attivitaMensili">
                                <ul id="listaAttivitaMensili" class="list-group">
                                    <!-- Attività mensili -->
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="attivitaAnnuali">
                                <ul id="listaAttivitaAnnuali" class="list-group">
                                    <!-- Attività annuali -->
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="attivitaOccasionali">
                                <ul id="listaAttivitaOccasionali" class="list-group">
                                    <!-- Attività occasionali -->
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Tab Sfide -->
                    <div class="tab-pane fade" id="sfide">
                        <hr class="divider-line">
                        <!-- Seconda distinzione per Frequenza -->
                        <ul class="nav nav-tabs flex-nowrap">
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#sfideSettimanali">📅 Settimanali</button>
                            </li>
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#sfideMensili">🗓️ Mensili</button>
                            </li>
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#sfideAnnuali">📆 Annuali</button>
                            </li>
                            <li class="nav-item flex-shrink-0">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#sfideOccasionali">🔀 Occasionali</button>
                            </li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="sfideSettimanali">
                                <ul id="listaSfideSettimanali" class="list-group">
                                    <!-- Sfide settimanali -->
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="sfideMensili">
                                <ul id="listaSfideMensili" class="list-group">
                                    <!-- Sfide mensili -->
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="sfideAnnuali">
                                <ul id="listaSfideAnnuali" class="list-group">
                                    <!-- Sfide annuali -->
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="sfideOccasionali">
                                <ul id="listaSfideOccasionali" class="list-group">
                                    <!-- Sfide occasionali -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
        <!-- Importo il file JavaScript di Bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>    
        <script src="codiceapp.js"></script> <!-- Collegamento al mio file JavaScript personalizzato -->
    </body>
</html>
